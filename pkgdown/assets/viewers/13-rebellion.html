    for (let j = 0; j < a.length; j += k) {
      const idx = a[j], code = a[j + 3];
      const n = seen.get(idx) || 0; seen.set(idx, n + 1);
      const x = idx % W, y = Math.floor(idx / W);
      // stack several agents on one cell in a small ring, so they all show
      const ang = n ? (n - 1) * 2.4 : 0, off = n ? cs * 0.22 : 0;
      const cx = (x + 0.5) * cs + Math.cos(ang) * off;
      const cy = (H - 0.5 - y) * cs + Math.sin(ang) * off;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = code === null ? "#888" : agentPal[code];
      ctx.fill();
      if (stroke) ctx.stroke();
    }
  }
  updateChrome();
}

// --- legend -------------------------------------------------------------
const legend = document.getElementById("legend");
const counters = [];                   // {spec, t: 'fill'|'agents', nodes: [...]}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function keyRow(colour, label, dot) {
  return '<div class="key"><span class="' + (dot ? "dot" : "sw") + '" style="background:' + colour + '"></span>' +
         '<span class="lab" title="' + esc(label) + '">' + esc(label) + '</span><span class="n"></span></div>';
}
function block(spec, heading, dot, countsFrom) {
  let html = "<section><h2>" + esc(heading) + "</h2>";
  if (spec.type === "discrete") {
    html += spec.levels.map((l, i) => keyRow(cssColour(spec.colours[i]), l, dot)).join("");
  } else {
    const stops = spec.colours.map((c, i) => cssColour(c) + " " + (100 * i / (spec.colours.length - 1)) + "%").join(",");
    html += '<div class="lab" title="' + esc(spec.name) + '">' + esc(spec.name) + "</div>" +
            '<div class="ramp" style="background:linear-gradient(90deg,' + stops + ')"></div>' +
            '<div class="ends"><span>' + fmt(spec, spec.min, 3).replace("≈", "") + "</span><span>" +
            fmt(spec, spec.max, 3).replace("≈", "") + "</span></div>";
  }
  html += "</section>";
  const sec = document.createElement("div"); sec.innerHTML = html;
  const node = sec.firstChild;
  legend.appendChild(node);
  if (spec.type === "discrete" && countsFrom) {
    counters.push({ spec, from: countsFrom, nodes: Array.from(node.querySelectorAll(".n")) });
  }
}
if (fillIx >= 0) block(layers[fillIx], "Cells", false, "fill");
if (markIx >= 0) block(layers[markIx], "Marks", false, "mark");
if (agents) block(agents.colour, "Agents", true, "agents");
if (!legend.children.length) legend.innerHTML = "<section><h2>Cells</h2><div class='key'><span class='sw' style='background:var(--cell)'></span><span class='lab'>cell</span></div></section>";
legend.insertAdjacentHTML("beforeend",
  '<div class="hint"><kbd>space</kbd> play · <kbd>←</kbd> <kbd>→</kbd> step · <kbd>shift</kbd> + <kbd>→</kbd> ten · hover a cell to read it</div>');
function counts() {
  const t = state.t;
  for (const c of counters) {
    const n = new Array(64).fill(0);
    if (c.from === "agents") {
      const a = agents.frames[t], k = agents.stride;
      for (let j = 0; j < a.length; j += k) if (a[j + 3] !== null) n[a[j + 3]]++;
    } else {
      const f = frame(t, c.from === "fill" ? fillIx : markIx);
      for (let i = 0; i < N; i++) if (f[i] !== NA) n[f[i]]++;
    }
    c.nodes.forEach((node, i) => { node.textContent = n[i]; });
  }
}

// --- playback -----------------------------------------------------------
const state = { t: 0, playing: false, speed: 1 };
const slider = document.getElementById("slider"), tickLabel = document.getElementById("tick");
const playBtn = document.getElementById("play");
slider.max = T - 1;
function setTick(t, fromSlider) {
  state.t = Math.min(Math.max(t, 0), T - 1);
  if (!fromSlider) slider.value = state.t;
  draw();
  if (hovered) readout(hovered.x, hovered.y, false);
}
function updateChrome() {
  tickLabel.textContent = "tick " + D.ticks[state.t] + " / " + D.ticks[T - 1];
  playBtn.textContent = state.playing ? "Pause" : "Play";
  playBtn.setAttribute("aria-pressed", state.playing);
  counts();
}
let last = 0, acc = 0;
function loop(now) {
  if (!state.playing) return;
  const dt = Math.min(now - last, 500); last = now;
  acc += dt * D.fps * state.speed / 1000;
  if (acc >= 1) {
    const steps = Math.floor(acc); acc -= steps;
    setTick((state.t + steps) % T);
  }
  requestAnimationFrame(loop);
}
function play(on) {
  if (T < 2) return;
  state.playing = on === undefined ? !state.playing : on;
  if (state.playing) { last = performance.now(); acc = 0; requestAnimationFrame(loop); }
  updateChrome();
}
playBtn.addEventListener("click", () => play());
document.getElementById("first").addEventListener("click", () => { play(false); setTick(0); });
document.getElementById("last").addEventListener("click", () => { play(false); setTick(T - 1); });
document.getElementById("prev").addEventListener("click", () => { play(false); setTick(state.t - 1); });
document.getElementById("next").addEventListener("click", () => { play(false); setTick(state.t + 1); });
slider.addEventListener("input", () => { play(false); setTick(+slider.value, true); });
document.getElementById("speed").addEventListener("change", e => { state.speed = +e.target.value; });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const k = e.shiftKey ? 10 : 1;
  if (e.key === " ") { e.preventDefault(); play(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); play(false); setTick(state.t + k); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); play(false); setTick(state.t - k); }
  else if (e.key === "Home") { play(false); setTick(0); }
  else if (e.key === "End") { play(false); setTick(T - 1); }
});

// --- hover ----------------------------------------------------------------
const tip = document.getElementById("tip"), out = document.getElementById("readout");
let hovered = null;
function describe(x, y) {              // x, y are 1-based lattice coordinates
  const t = state.t, i = (x - 1) + (y - 1) * W;
  const lines = ["cell (" + x + ", " + y + ")"];
  layers.forEach((l, k) => {
    const v = value(l, frame(t, k)[i]);
    if (l.role === "mark" && v === null) return;
    lines.push(l.name + ": " + fmt(l, v));
  });
  if (agents) {
    const a = agents.frames[t], k = agents.stride;
    let n = 0;
    for (let j = 0; j < a.length; j += k) {
      if (a[j] !== i) continue;
      n++;
      let s = agents.groups[a[j + 2]] + " #" + a[j + 1];
      if (agents.colour.name !== ".group") s += " · " + agents.colour.name + " " + fmt(agents.colour, value(agents.colour, a[j + 3]));
      agents.hover.forEach((h, m) => { s += " · " + h.name + " " + fmt(h, value(h, a[j + 4 + m])); });
      lines.push(s);
    }
    if (!n) lines.push("no agent here");
  }
  return lines;
}
function readout(x, y, showTip, px, py) {
  const lines = describe(x, y);
  out.textContent = lines.join("  ·  ");
  if (showTip) {
    tip.textContent = lines.join("\n");
    tip.style.display = "block";
    const box = canvas.parentElement.getBoundingClientRect();
    let left = px + 14, top = py + 14;
    if (left + tip.offsetWidth > box.width - 8) left = px - tip.offsetWidth - 10;
    if (top + tip.offsetHeight > box.height - 8) top = py - tip.offsetHeight - 10;
    tip.style.left = Math.max(4, left) + "px"; tip.style.top = Math.max(4, top) + "px";
  }
}
function cellAt(e) {
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const x = Math.floor(px / cs) + 1, y = H - Math.floor(py / cs);
  if (x < 1 || x > W || y < 1 || y > H) return null;
  return { x, y, px: px + 10, py: py + 10 };
}
canvas.addEventListener("pointermove", e => {
  const c = cellAt(e);
  if (!c) { hovered = null; tip.style.display = "none"; return; }
  hovered = c;
  readout(c.x, c.y, e.pointerType === "mouse", c.px, c.py);
});
canvas.addEventListener("pointerdown", e => {
  const c = cellAt(e);
  if (c) { hovered = c; readout(c.x, c.y, false); }
});
canvas.addEventListener("pointerleave", () => { hovered = null; tip.style.display = "none"; });

// --- theme and layout -------------------------------------------------------
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark"
             : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  draw();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
window.addEventListener("resize", () => { size(); draw(); });
document.getElementById("title").textContent = D.title;
document.getElementById("subtitle").textContent = D.subtitle || (W + " × " + H + " lattice, " + T + (T === 1 ? " frame" : " frames"));
if (!D.subtitle) document.getElementById("subtitle").textContent += agents ? ", " + agents.groups.join(" and ") + " on it" : "";
out.textContent = "hover a cell to read it";
size();
setTick(0);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Wolf-Sheep-Grass</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfbf9; --panel: #ffffff; --ink: #1f2328; --muted: #6b7280;
  --line: #d9dcdf; --accent: #0072b2; --accent-ink: #ffffff; --cell: #e3e3e0;
  --control: #f1f2f0; --control-hover: #e4e6e3; --shadow: 0 1px 2px rgba(0,0,0,.06);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16181c; --panel: #1f2227; --ink: #e6e7ea; --muted: #9aa0a8;
    --line: #363b43; --accent: #56b4e9; --accent-ink: #0b1118; --cell: #3a3e45;
    --control: #272b31; --control-hover: #31363d; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #16181c; --panel: #1f2227; --ink: #e6e7ea; --muted: #9aa0a8;
  --line: #363b43; --accent: #56b4e9; --accent-ink: #0b1118; --cell: #3a3e45;
  --control: #272b31; --control-hover: #31363d; --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); }
body { padding: 20px 16px 32px; line-height: 1.4; }
.page { max-width: 1040px; margin: 0 auto; }
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 1.25rem; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.subtitle { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.theme { flex: none; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 20px; align-items: start; }
@media (max-width: 720px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.view { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; box-shadow: var(--shadow); }
canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; border-radius: 4px; }
.tip { position: absolute; pointer-events: none; display: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 0.78rem; line-height: 1.35; max-width: 260px; white-space: pre-line; z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
button, select { font: inherit; color: var(--ink); background: var(--control); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 36px; }
button:hover, select:hover { background: var(--control-hover); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.play { background: var(--accent); color: var(--accent-ink); border-color: transparent; min-width: 76px; font-weight: 600; }
.step { min-width: 36px; padding: 6px 8px; }
.tick { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.slider { flex: 1 1 140px; display: flex; align-items: center; min-width: 120px; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.speed { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); }
.readout { margin-top: 10px; min-height: 1.4em; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); font-size: 0.85rem; }
aside h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
aside section + section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.key { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.15); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; margin: 0 1px; }
.lab { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n { font-variant-numeric: tabular-nums; font-family: var(--mono); color: var(--muted); font-size: 0.78rem; }
.ramp { height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); margin: 4px 0 2px; }
.ends { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }
.hint { margin-top: 10px; font-size: 0.75rem; color: var(--muted); }
kbd { font-family: var(--mono); font-size: 0.72rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
</style>
</head>

        <div class="slider"><input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Tick"></div>

          </select>
        </label>
      </div>
      <div class="readout" id="readout"></div>
    </div>
    <aside id="legend"></aside>
  </div>
</div>

function updateChrome() {
  tickLabel.textContent = "tick " + D.ticks[state.t] + " / " + D.ticks[T - 1];
  playBtn.textContent = state.playing ? "Pause" : "Play";
  playBtn.setAttribute("aria-pressed", state.playing);
  counts();
}
let last = 0, acc = 0;
function loop(now) {
  if (!state.playing) return;
  const dt = Math.min(now - last, 500); last = now;
  acc += dt * D.fps * state.speed / 1000;
  if (acc >= 1) {
    const steps = Math.floor(acc); acc -= steps;
    setTick((state.t + steps) % T);
  }
  requestAnimationFrame(loop);
}
function play(on) {
  if (T < 2) return;
  state.playing = on === undefined ? !state.playing : on;
  if (state.playing) { last = performance.now(); acc = 0; requestAnimationFrame(loop); }
  updateChrome();
}
playBtn.addEventListener("click", () => play());
document.getElementById("first").addEventListener("click", () => { play(false); setTick(0); });
document.getElementById("last").addEventListener("click", () => { play(false); setTick(T - 1); });
document.getElementById("prev").addEventListener("click", () => { play(false); setTick(state.t - 1); });
document.getElementById("next").addEventListener("click", () => { play(false); setTick(state.t + 1); });
slider.addEventListener("input", () => { play(false); setTick(+slider.value, true); });
document.getElementById("speed").addEventListener("change", e => { state.speed = +e.target.value; });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const k = e.shiftKey ? 10 : 1;
  if (e.key === " ") { e.preventDefault(); play(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); play(false); setTick(state.t + k); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); play(false); setTick(state.t - k); }
  else if (e.key === "Home") { play(false); setTick(0); }
  else if (e.key === "End") { play(false); setTick(T - 1); }
});

// --- hover ----------------------------------------------------------------
const tip = document.getElementById("tip"), out = document.getElementById("readout");
let hovered = null;
function describe(x, y) {              // x, y are 1-based lattice coordinates
  const t = state.t, i = (x - 1) + (y - 1) * W;
  const lines = ["cell (" + x + ", " + y + ")"];
  layers.forEach((l, k) => {
    const v = value(l, frame(t, k)[i]);
    if (l.role === "mark" && v === null) return;
    lines.push(l.name + ": " + fmt(l, v));
  });
  if (agents) {
    const a = agents.frames[t], k = agents.stride;
    let n = 0;
    for (let j = 0; j < a.length; j += k) {
      if (a[j] !== i) continue;
      n++;
      let s = agents.groups[a[j + 2]] + " #" + a[j + 1];
      if (agents.colour.name !== ".group") s += " · " + agents.colour.name + " " + fmt(agents.colour, value(agents.colour, a[j + 3]));
      agents.hover.forEach((h, m) => { s += " · " + h.name + " " + fmt(h, value(h, a[j + 4 + m])); });
      lines.push(s);
    }
    if (!n) lines.push("no agent here");
  }
  return lines;
}
function readout(x, y, showTip, px, py) {
  const lines = describe(x, y);
  out.textContent = lines.join("  ·  ");
  if (showTip) {
    tip.textContent = lines.join("\n");
    tip.style.display = "block";
    const box = canvas.parentElement.getBoundingClientRect();
    let left = px + 14, top = py + 14;
    if (left + tip.offsetWidth > box.width - 8) left = px - tip.offsetWidth - 10;
    if (top + tip.offsetHeight > box.height - 8) top = py - tip.offsetHeight - 10;
    tip.style.left = Math.max(4, left) + "px"; tip.style.top = Math.max(4, top) + "px";
  }
}
function cellAt(e) {
  const r = canvas.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const x = Math.floor(px / cs) + 1, y = H - Math.floor(py / cs);
  if (x < 1 || x > W || y < 1 || y > H) return null;
  return { x, y, px: px + 10, py: py + 10 };
}
canvas.addEventListener("pointermove", e => {
  const c = cellAt(e);
  if (!c) { hovered = null; tip.style.display = "none"; return; }
  hovered = c;
  readout(c.x, c.y, e.pointerType === "mouse", c.px, c.py);
});
canvas.addEventListener("pointerdown", e => {
  const c = cellAt(e);
  if (c) { hovered = c; readout(c.x, c.y, false); }
});
canvas.addEventListener("pointerleave", () => { hovered = null; tip.style.display = "none"; });

// --- theme and layout -------------------------------------------------------
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark"
             : window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  draw();
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
window.addEventListener("resize", () => { size(); draw(); });
document.getElementById("title").textContent = D.title;
document.getElementById("subtitle").textContent = D.subtitle || (W + " × " + H + " lattice, " + T + (T === 1 ? " frame" : " frames"));
if (!D.subtitle) document.getElementById("subtitle").textContent += agents ? ", " + agents.groups.join(" and ") + " on it" : "";
out.textContent = "hover a cell to read it";
size();
setTick(0);
</script>
</body>
</html>

# cargo-deny configuration (CI job `deny` in .github/workflows/rust.yaml).
# Local run, if cargo-deny is installed: cargo deny check (from src/rust).
# tidyABM is MIT; every crate it links must carry an MIT-compatible licence.

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[advisories]
# RustSec database (the one cargo-audit reads); yanked crates are errors too
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
